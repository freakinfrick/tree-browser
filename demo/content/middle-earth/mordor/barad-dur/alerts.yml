# Alertmanager config: the Eye of Sauron
# Filed by: the Eye itself (who else would file it). TA 1600, re-issued TA 3019.
# Ticket: EYE-1 (never closed; closed with the tower, 3019-03-25).
# The Eye does not sleep; the Eye does not page out. It simply knows.

route:
  receiver: eye-of-sauron
  group_by: ['region']
  group_wait: 0s          # the Eye has already seen it
  group_interval: 0s
  repeat_interval: 0s     # the Eye does not need to be reminded

receivers:
  - name: eye-of-sauron
    webhook_configs:
      - url: "https://barad-dur.internal/alerts"

inhibit_rules:
  - source_match:
      alertname: RingFound
    target_match:
      alertname: EverythingElse
    equal: ['region']
    # once the Ring is found, nothing else matters.
  - source_match:
      alertname: FireOfMountDoom
    target_match:
      alertname: RingDetected
    equal: ['region']
    # once the Ring is IN the fire, it no longer matters where it was.

groups:
  - name: the-shadow
    rules:
      - alert: RingDetected
        expr: ring_location != "unknown"
        labels: {severity: critical}
        annotations:
          summary: "The Ring has been put on."
          description: "The Eye now knows exactly where you are. Run."
      - alert: RingDetected
        # follow-up: the Eye does not, in fact, watch the Shire subnet
        # (see ARCHITECTURE.md). It looks elsewhere; the Ring stays hidden.
        expr: ring_location == "unknown"
        for: 0s
        labels: {severity: silent}
        annotations:
          summary: "The Ring is hidden from sight."
          description: "No datapoint. Nothing to see here. Do not re-scan the Shire."
      - alert: NazgulDown
        expr: nazgul_active < 9
        labels: {severity: page}
        annotations:
          summary: "A Nazgûl is offline."
          description: "See mordor/barad-dur/nazgul-roster.csv. One of them met a woman."
      - alert: NazgulActive
        expr: nazgul_active >= 1
        labels: {severity: info}
        annotations:
          summary: "Nazgûl airborne."
          description: "Flight paths active. Screeching expected downwind. Nine as of TA 3019-01; zero after 3019-03-25."
      - alert: FireOfMountDoom
        expr: ring_in_fire == 1
        labels: {severity: the_end}
        annotations:
          summary: "The Ring is in the fire of Mount Doom."
          description: "This is not a drill. Barad-dûr is load-bearing on the Ring. Evacuate (you cannot)."
      - alert: EyeClosed
        expr: eye_awake_seconds_total == 0
        labels: {severity: the_end}
        annotations:
          summary: "The Eye is closed."
          description: "Barad-dûr has failed. The shadow has departed. Run the victory log."

# Addendum (later): the EyeClosed alert fired 3019-03-25 10:33:05. There was
# nobody left to page. The receiver webhook returned 404: host not found.
# See mordor/barad-dur/structural-failure.log and mordor/barad-dur/eye-uptime.prom.