# Isengard: uruk-hai production deployment
# The industrialization of war, as shipped. Later decommissioned by ents.
#
# filed by: the White Hand, Orthanc (3019-02-26)
# status: RECALLED / MISDELIVERED (see fangorn/breaking-of-isengard.md)
# see also: uruk-hai-production.csv, fangorn/entmoot/, mordor/barad-dur/orc-hr/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: uruk-hai
  namespace: isengard
  labels:
    app: uruk-hai
    owner: saruman
  annotations:
    deploymentTargets: "rohan, helms-deep, fangorn (misdelivered)"
spec:
  replicas: 10000          # "the host of Isengard"
  strategy:
    type: Recreate         # no rolling update; there is no back version
  selector:
    matchLabels:
      app: uruk-hai
  template:
    metadata:
      labels:
        app: uruk-hai
    spec:
      containers:
        - name: fighting-uruk-hai
          image: orthanc/uruk:latest
          args: ["--march", "--to", "helms-deep"]
          env:
            - name: DAYLIGHT_TOLERANT
              value: "true"          # the key advantage over mordor stock
            - name: SUNLIGHT_ALLERGY
              value: "none"
            - name: PRIMARY_TARGET
              value: "rohan"         # the doorway to Gondor's west
            - name: SECONDARY_TARGET
              value: "helms-deep"    # "to the last drop of blood" — Saruman, Orthanc, 3019-03-01
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /etc/orthanc/armour"]
            initialDelaySeconds: 0
            periodSeconds: 0
---
# The Fangorn batch: captured two halflings, ordered west, misdelivered.
# Escort (Uglúk) intercepted by the Riders of Rohan on the Fangorn edge; the
# halflings were logged to the ents instead of Orthanc. See fangorn/entmoot/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uruk-hai-fangorn-escort
  namespace: isengard
  labels:
    app: uruk-hai
    instance: fangorn-escort
  annotations:
    status: "misdelivered"
    lastSeen: "fangorn/entmoot/"
spec:
  replicas: 1              # one escort column; none arrived
  selector:
    matchLabels:
      app: uruk-hai
      instance: fangorn-escort
  template:
    metadata:
      labels:
        app: uruk-hai
        instance: fangorn-escort
    spec:
      containers:
        - name: escort-uruk-hai
          image: orthanc/uruk:latest
          args: ["--march", "--to", "orthanc", "--cargo", "halflings:2"]
          env:
            - name: CARGO
              value: "halflings:2"   # "bring me the halflings alive and unspoiled" — Uglúk, Rauros shore, 3019-02-26
---
# The forest was not in the pod spec. That was the mistake.
apiVersion: v1
kind: Namespace
metadata:
  name: isengard
  annotations:
    fangorn.response: "flooded by trees; see fangorn/huorn-migration.csv"
