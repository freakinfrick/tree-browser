    <text x="540" y="75" text-anchor="middle" font-size="18">Caradhras</text>
    <text x="150" y="325" text-anchor="middle" font-size="16">Rivendell</text>
    <text x="610" y="325" text-anchor="middle" font-size="16">Lórien</text>
    <text x="400" y="385" text-anchor="middle" font-size="14" font-style="italic">route: under, not over (see moria/)</text>
