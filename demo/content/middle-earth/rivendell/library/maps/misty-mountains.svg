<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>The Misty Mountains — Rivendell library, map 4 of 9</title>
  <desc>Survey of the Hithaeglir drawn for the Council of Elrond (3018-10). The
    Fellowship argued the Redhorn Pass; the map's own caption records the
    verdict: under, not over. See misty-mountains/caradhras/route-vote.md and
    moria/.</desc>
  <metadata>
