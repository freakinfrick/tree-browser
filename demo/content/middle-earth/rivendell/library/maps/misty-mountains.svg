      note="The dashed line is the route as planned at the Council; it is
      dashed for a reason."/>
  </metadata>
  <rect width="800" height="400" fill="#efe3c2"/>
  <g fill="none" stroke="#5b4630" stroke-width="3" stroke-linejoin="round">
    <path d="M40 330 L110 180 L150 250 L210 110 L270 260 L320 150 L380 290"/>
    <path d="M360 300 L430 120 L480 230 L540 90 L600 250 L650 160 L720 320"/>
    <path d="M540 90 L560 130 M430 120 L445 150 M210 110 L225 145" stroke-width="2"/>
