  <circle cx="160" cy="300" r="7" fill="#8a1c1c"/>
  <circle cx="610" cy="300" r="7" fill="#8a1c1c"/>
  <path d="M167 300 C 300 260, 480 330, 603 300" stroke="#8a1c1c" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <g font-family="serif" fill="#3a2a18">
