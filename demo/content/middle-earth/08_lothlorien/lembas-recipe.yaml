# lembas (waybread)
# provenance: baked in Caras Galadhon by the maidens of the wood
# filed: TA 3019-02-14 · ledger: galadhrim-commissary-0047
# cross-refs: 08_lothlorien/farewell-gifts.md (issued to all, 3019-02-16)
#            02_the-shire/fourth-age.md (Sam carried the last leaf home)
name: lembas (waybread)
serves: one grown man for one day of hard travel
secret: true   # the Lady does not share this
origin: "the gift of the Valar, older than any seed the Elves now keep"
potency: "one wafer and a sip of water will keep a grown man a day's march;
  it gives strength in the wearing that other food does not"
field_notes:
  - author: Samwise Gamgee
    date: 3019-02-14
    note: "better than the best cram, and that's saying it twice."
  - author: Samwise Gamgee
    date: 3019-03-02
    note: "we are on short commons already and the waybread is the only
      thing between us and our bellies giving out."
  - author: Samwise Gamgee
    date: 3019-03-20
    note: "even this grows tiresome when it is all there is. but it keeps
      a hobbit on his feet, and that is what was wanted."
ingredients:
  - flour: "[redacted]"
  - honey: "[redacted]"
  - leaves: mallorn, to wrap
steps:
  - "[redacted]"
  - "[redacted]"
storage: "keeps for many days if the leaves are not broken"
warning: "do not let the hobbits compare it to cram"
