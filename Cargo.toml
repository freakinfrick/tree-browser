[package]
name = "treebeard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Horizontal tree file browser for the terminal, colored by recursive modification time"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freakinfrick/treebeard"
readme = "README.md"
keywords = ["file-browser", "tui", "terminal", "tree", "file-manager"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/demo"]

# treebeard is the project; tb is the command you type.
[[bin]]
name = "tb"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "7"
crossterm = "0.28"
image = "0.25"
libc = "0.2"
ratatui = "0.29"
ratatui-image = "8"
rodio = { version = "0.22", default-features = false, features = ["flac", "mp3", "mp4", "vorbis", "wav"], optional = true }
unicode-width = "0.2"

# Linux and the BSDs play through the system's libasound, loaded at run time (src/alsa.rs),
# so the build needs no ALSA headers. macOS uses rodio's own CoreAudio output, which needs none.
[target.'cfg(target_os = "macos")'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback"], optional = true }

[features]
default = ["audio"]
# Sound playback in previews. Builds with no system packages; build with
# --no-default-features to leave it out.
audio = ["dep:rodio"]
