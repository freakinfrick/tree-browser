[package]
name = "tb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Horizontal tree file browser for the terminal, colored by recursive modification time"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freakinfrick/tree-browser"
readme = "README.md"
keywords = ["file-browser", "tui", "terminal", "tree", "file-manager"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/demo"]

[dependencies]
ansi-to-tui = "7"
crossterm = "0.28"
image = "0.25"
libc = "0.2"
ratatui = "0.29"
ratatui-image = "8"
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"], optional = true }
unicode-width = "0.2"

[features]
default = ["audio"]
# Sound playback in previews. On Linux it needs the ALSA headers (libasound2-dev /
# alsa-lib-devel); build with --no-default-features to leave it out.
audio = ["dep:rodio"]
